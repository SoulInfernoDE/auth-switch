[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-switch"
description = "GUI and MCP server for switching Proxmox VE accounts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dynamic = ["version"]
keywords = ["proxmox", "pve", "gtk", "mcp"]

[project.scripts]
auth-switch-mcp = "authswitch.mcp:main"

[project.gui-scripts]
auth-switch = "authswitch.__main__:main"

[tool.setuptools]
packages = ["authswitch"]

[tool.setuptools.package-data]
authswitch = ["sounds/*.wav", "icons/hicolor/scalable/apps/*.svg", "locale/*/LC_MESSAGES/*.mo"]

[tool.setuptools.dynamic]
version = { attr = "authswitch.__version__" }

[tool.setuptools.data-files]
"share/applications" = ["data/dev.authswitch.AuthSwitch.desktop"]
"share/icons/hicolor/scalable/apps" = ["authswitch/icons/hicolor/scalable/apps/dev.authswitch.AuthSwitch.svg"]
